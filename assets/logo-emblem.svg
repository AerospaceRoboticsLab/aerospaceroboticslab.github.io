<svg width="220" height="220" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="AstroX mission emblem — Aerospace Stochastic Robotics and Exploration, Nakka Lab, Georgia Tech">
  <defs>
    <path id="tp" d="M15,100 A85,85 0 0 1 185,100"/>
    <path id="bp" d="M185,100 A85,85 0 0 1 15,100"/>
    <path id="star" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z"/>
    <clipPath id="disc"><circle cx="100" cy="100" r="82"/></clipPath>
  </defs>

  <!-- rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1f1f24" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="#1f1f24" stroke-width="1"/>
  <circle cx="12" cy="100" r="2.6" fill="#8a8a93"/>
  <circle cx="188" cy="100" r="2.6" fill="#8a8a93"/>

  <!-- curved lab text -->
  <text font-family="SF Mono, Menlo, Consolas, monospace" font-size="8.5" font-weight="700" letter-spacing="1.6" fill="#1f1f24">
    <textPath xlink:href="#tp" href="#tp" startOffset="50%" text-anchor="middle">ASTROX LAB · GEORGIA TECH</textPath>
  </text>
  <text font-family="SF Mono, Menlo, Consolas, monospace" font-size="7" font-weight="700" letter-spacing="0.2" fill="#1f1f24">
    <textPath xlink:href="#bp" href="#bp" startOffset="50%" text-anchor="middle">AEROSPACE STOCHASTIC ROBOTICS AND EXPLORATION LAB</textPath>
  </text>

  <g clip-path="url(#disc)">
    <!-- starfield glow -->
    <circle cx="100" cy="92" r="78" fill="#f7f7f8"/>

    <!-- Earth disc, upper -->
    <circle cx="100" cy="54" r="12" fill="#1f1f24"/>
    <path d="M100,42 a12,12 0 0 1 0,24 a8,12 0 0 0 0,-24 z" fill="#3a3a42"/>

    <!-- stars -->
    <g fill="#8a8a93">
      <use xlink:href="#star" href="#star" transform="translate(60,64) scale(0.9)"/>
      <use xlink:href="#star" href="#star" transform="translate(142,62) scale(0.7)"/>
      <use xlink:href="#star" href="#star" transform="translate(152,96) scale(0.55)"/>
      <use xlink:href="#star" href="#star" transform="translate(48,98) scale(0.6)"/>
    </g>

    <!-- orbital rings forming the X -->
    <g stroke="#1f1f24" stroke-width="2" fill="none">
      <ellipse cx="100" cy="90" rx="50" ry="17" transform="rotate(28 100 90)"/>
      <ellipse cx="100" cy="90" rx="50" ry="17" transform="rotate(-28 100 90)"/>
    </g>
    <circle cx="100" cy="90" r="4.5" fill="#8a8a93"/>
    <circle cx="143" cy="113" r="3.2" fill="#8a8a93"/>
    <circle cx="57" cy="67" r="2.4" fill="#1f1f24"/>
    <circle cx="143" cy="67" r="2.4" fill="#1f1f24"/>

    <!-- lunar surface -->
    <path d="M14,126 Q100,112 186,126 L186,186 L14,186 Z" fill="#f0f0f2" stroke="#1f1f24" stroke-width="1.6"/>
    <ellipse cx="54" cy="134" rx="8" ry="2.4" fill="none" stroke="#9094a0" stroke-width="1.2"/>
    <ellipse cx="150" cy="132" rx="6" ry="2" fill="none" stroke="#9094a0" stroke-width="1.2"/>

    <!-- wheel tracks -->
    <path d="M70,126 q16,-2 22,-2" fill="none" stroke="#9094a0" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- rover (surface mobility) -->
    <g transform="translate(100,124)">
      <circle cx="-6" cy="0" r="2.8" fill="#1f1f24"/>
      <circle cx="6" cy="0" r="2.8" fill="#1f1f24"/>
      <rect x="-9.5" y="-8" width="19" height="7" rx="1.6" fill="#1f1f24"/>
      <rect x="-2" y="-13" width="7" height="6" rx="1" fill="#1f1f24"/>
      <line x1="6" y1="-8" x2="9" y2="-16" stroke="#1f1f24" stroke-width="1.3"/>
      <circle cx="9" cy="-16" r="1.5" fill="#8a8a93"/>
    </g>
  </g>
</svg>
